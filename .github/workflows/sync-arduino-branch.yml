name: Sync Arduino Branch

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push firmware/ to arduino branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=firmware -b arduino
          git push origin arduino --force